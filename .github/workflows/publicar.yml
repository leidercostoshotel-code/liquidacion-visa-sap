# Publica el sitio en Firebase Hosting (liquidacion-sap.web.app) cada vez que se fusiona un cambio en main.
# También se puede lanzar a mano desde GitHub: Actions → «Publicar en Firebase» → Run workflow.
# Necesita el secreto FIREBASE_SERVICE_ACCOUNT_LIQUIDACION_SAP (ver README, «Publicación automática»).
name: Publicar en Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publicar-firebase
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      TIENE_CLAVE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIQUIDACION_SAP != '' }}
    steps:
      - name: Falta la clave de Firebase
        if: env.TIENE_CLAVE != 'true'
        run: echo "::warning::No se publicó. Falta el secreto FIREBASE_SERVICE_ACCOUNT_LIQUIDACION_SAP (ver README, «Publicación automática»)."

      - uses: actions/checkout@v4
        if: env.TIENE_CLAVE == 'true'

      - uses: FirebaseExtended/action-hosting-deploy@v0
        if: env.TIENE_CLAVE == 'true'
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIQUIDACION_SAP }}
          projectId: liquidacion-sap
          channelId: live
